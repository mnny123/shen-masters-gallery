<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seekers: Shen Rising · Gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>
:root {
  --bg: #f3ece0; --panel: #4a301e; --panel-2: #684628; --cream: #f4e6c8; --fg: #2b1d12;
  --muted: #7a6450; --line: #dccbb0; --card: #fbf6ee; --accent: #c9952f;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1d140d; --panel: #3a2516; --panel-2: #573a22; --cream: #f1e2c2; --fg: #f1e6d4;
  --muted: #b39c80; --line: #3d2c1e; --card: #281b11; --accent: #e0b04a; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
.hud { background: var(--panel); color: var(--cream); border: 3px solid var(--cream); border-radius: 6px; box-shadow: 0 0 0 3px var(--panel); margin: 3px; padding: 22px 20px 18px; display: grid; gap: 14px; }
.hud h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 5vw, 2.6rem); margin: 0; line-height: 1.05; text-wrap: balance; }
.hud .sub { margin: 0; opacity: .8; font-size: .9rem; }
.stats { font-family: var(--mono); font-size: .8rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.tabs, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { font: 600 .85rem var(--body); color: var(--cream); background: transparent; border: 2px solid var(--cream); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--cream); color: var(--panel); }
.chip { font: 500 .78rem var(--body); color: var(--cream); background: var(--panel-2); border: 2px solid transparent; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
.chip:hover, .tab:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--cream); color: var(--panel); }
.chip span { opacity: .7; margin-left: 4px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
section { margin-top: 32px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-bottom: 14px; }
.sec-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0; }
.sec-head .meta { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.thumb { all: unset; box-sizing: border-box; cursor: zoom-in; display: grid; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 6px; min-width: 0; }
.thumb:hover { border-color: var(--accent); }
.thumb img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 2px; background: var(--line); display: block; }
.cap { font-size: .78rem; overflow-wrap: anywhere; line-height: 1.3; }
.when { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
.lb { position: fixed; inset: 0; z-index: 50; background: rgb(15 9 5 / .94); display: grid; grid-template-rows: auto 1fr auto; padding: 10px 12px; gap: 8px; }
.lb[hidden] { display: none; }
.lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #f4e6c8; }
.lb-title { font-size: .85rem; overflow-wrap: anywhere; min-width: 0; }
.lb-title small { display: block; font-family: var(--mono); opacity: .7; font-size: .7rem; }
.lb-stage { min-height: 0; display: grid; place-items: center; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border: 2px solid #f4e6c8; border-radius: 3px; }
.lb-nav { display: flex; justify-content: center; gap: 10px; }
.lb button { font: 600 .85rem var(--body); color: #4a301e; background: #f4e6c8; border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
.empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <h1>Seekers: Shen Rising</h1>
    <p class="sub">Development gallery. Maps, characters and animation as they get built. Newest first; tap any image to see it full size.</p>
    <div class="stats" id="stats">Loading…</div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
  </header>
  <main id="main"></main>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Full-size image">
  <div class="lb-top"><div class="lb-title" id="lbTitle"></div><button id="lbClose" type="button">Close</button></div>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <div class="lb-nav"><button id="lbPrev" type="button">← Previous</button><button id="lbNext" type="button">Next →</button></div>
</div>
<script>
const TABS = [["maps", "Maps & World"], ["characters", "Characters & Animation"], ["history", "Build History"]];
const LABELS = {
  "Docs/Screens/Chats/Zabar_Heavenreach_chat": "Zabar & Heavenreach · chat screenshots",
  "Docs/Screens/Chats/ShenRelease_chat": "Shen Release · chat screenshots",
  "Docs/Screens/Chats/CombatAnimation_chat": "Combat animation · chat screenshots",
  "Docs/Screens/Chats/BeastAnimations_chat": "Beast animations · chat screenshots",
  "Docs/Screens/Chats/BossIntros_chat": "Boss intros · chat screenshots",
  "Docs/Screens/Chats/Build_chat": "Build chat · Phases 1-9",
  "Docs/Screens/Zabar_2026-11-18": "Zabar City · Studio (18 Nov)",
  "Docs/Screens/Zabar_2026-11-17": "Zabar City · Studio (17 Nov)",
  "Docs/Screens/Heavenreach_2026-11-18": "Heavenreach · Studio",
  "Docs/Screens/shenrelease": "Shen Release meter",
  "Docs/Screens/beasts": "Beasts · Studio",
  "Docs/Screens/BossIntros": "Boss intros",
  "Docs/Previews/punch_onion": "Punch animation (onion skins)",
  "Docs/Previews": "Previews · misc",
  "Docs/Previews/Wildlife": "Wildlife models",
  "Docs/Previews/Harbour": "Harbour models",
  "Docs/Previews/City": "Zabar City models",
  "Docs/Previews/Bear": "Bear model",
  "Docs/Previews/Phase9": "Mount Kukaro (Phase 9)",
  "Docs/Previews/Phase8": "Heavenreach Arena (Phase 8)",
  "Docs/Previews/Phase7": "Heavenreach (Phase 7)",
  "Docs/Previews/Phase6": "Seeker Exam (Phase 6)",
  "Art/Icons": "Icons", "Docs/PassIcons": "Pass icons", "Docs": "Docs", "Blender/_prev": "Blender previews"
};
const label = g => LABELS[g] || g.replace(/^Docs\//, "").replace(/\//g, " · ").replace(/_/g, " ");
const fmt = t => new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const pretty = n => n.replace(/[_-]+/g, " ");
const url = p => "img/" + p.split("/").map(encodeURIComponent).join("/");

let ITEMS = [], tab = "maps", filter = "all", visible = [];
try { tab = localStorage.getItem("sg-tab") || "maps"; } catch (e) {}
const tabsEl = document.getElementById("tabs"), chips = document.getElementById("chips"), main = document.getElementById("main");

function renderTabs() {
  tabsEl.textContent = "";
  for (const [k, name] of TABS) {
    const n = ITEMS.filter(i => i.k === k).length;
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(k === tab));
    b.textContent = `${name} (${n})`;
    b.onclick = () => { tab = k; filter = "all"; try { localStorage.setItem("sg-tab", k); } catch (e) {} render(); };
    tabsEl.appendChild(b);
  }
}
function render() {
  renderTabs();
  const list = ITEMS.filter(i => i.k === tab);
  const groups = [], byG = new Map();
  for (const it of list) { if (!byG.has(it.g)) { byG.set(it.g, []); groups.push(it.g); } byG.get(it.g).push(it); }
  if (filter !== "all" && !byG.has(filter)) filter = "all";
  chips.textContent = "";
  const chip = (key, text, n) => { const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(filter === key)); b.innerHTML = `${text}<span>${n}</span>`; b.onclick = () => { filter = key; render(); }; chips.appendChild(b); };
  chip("all", "All", list.length);
  for (const g of groups) chip(g, label(g), byG.get(g).length);
  main.textContent = ""; visible = [];
  if (!list.length) { main.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
  for (const g of (filter === "all" ? groups : [filter])) {
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="sec-head"><h2></h2><span class="meta">${byG.get(g).length} images</span></div><div class="grid"></div>`;
    sec.querySelector("h2").textContent = label(g);
    const grid = sec.querySelector(".grid");
    for (const it of byG.get(g)) {
      const idx = visible.push(it) - 1;
      const b = document.createElement("button"); b.type = "button"; b.className = "thumb";
      b.innerHTML = `<img loading="lazy" decoding="async" alt=""><span class="cap"></span><span class="when"></span>`;
      const img = b.querySelector("img"); img.src = url(it.p); img.alt = pretty(it.n);
      b.querySelector(".cap").textContent = pretty(it.n);
      b.querySelector(".when").textContent = fmt(it.t);
      b.onclick = () => open(idx);
      grid.appendChild(b);
    }
    main.appendChild(sec);
  }
}
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbTitle = document.getElementById("lbTitle");
let cur = 0, lastFocus = null;
function show(i) {
  cur = (i + visible.length) % visible.length; const it = visible[cur];
  lbImg.src = url(it.p); lbImg.alt = pretty(it.n);
  lbTitle.textContent = pretty(it.n);
  const s = document.createElement("small"); s.textContent = `${label(it.g)} · ${fmt(it.t)} · ${cur + 1} / ${visible.length}`; lbTitle.appendChild(s);
}
function open(i) { lastFocus = document.activeElement; show(i); lb.hidden = false; document.getElementById("lbClose").focus(); }
function close() { lb.hidden = true; lbImg.removeAttribute("src"); if (lastFocus) lastFocus.focus(); }
document.getElementById("lbClose").onclick = close;
document.getElementById("lbPrev").onclick = () => show(cur - 1);
document.getElementById("lbNext").onclick = () => show(cur + 1);
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-stage")) close(); });
document.addEventListener("keydown", e => { if (lb.hidden) return; if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") show(cur - 1); else if (e.key === "ArrowRight") show(cur + 1); });
let sx = null;
lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); sx = null; });

fetch("manifest.json", { cache: "no-store" }).then(r => r.json()).then(data => {
  ITEMS = data.items;
  document.getElementById("stats").textContent = `${ITEMS.length} images · updated ${fmt(data.updated)}`;
  if (!TABS.some(t => t[0] === tab)) tab = "maps";
  render();
}).catch(() => { document.getElementById("stats").textContent = "Couldn't load the image list."; });
</script>
</body>
</html>
